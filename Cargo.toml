[package]
name = "plutus-midnight-verifier-gen"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
# midnight-zk dependencies (replaces IOG halo2_proofs)
# CRITICAL: Disable committed-instances feature to match IOG halo2_proofs behavior
# NOTE: midnight-circuits removed because it force-enables committed-instances feature
midnight-proofs = { path = "../midnight-zk/proofs", package = "midnight-proofs", default-features = false, features = ["bits", "cost-estimator", "circuit-params"] }
midnight-curves = { path = "../midnight-zk/curves" }


# Curve and field libraries (already compatible)
halo2curves = { version = "0.7.0" }
blstrs = { git = "https://github.com/davidnevadoc/blstrs", rev = "3dfe5bf" }

ff = "0.13.0"
serde_json = "1.0.113"
blake2b_simd = "1.0.2"
handlebars = "6.1.0"
itertools = "0.14.0"
hex = "0.4.3"
log = "0.4.22"
env_logger = "0.11.5"
rand_core = { package = "rand_core", version = "0.6.4" }
serde = { version = "1.0.219", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3.1"

[features]
plutus_debug = []

[[example]]
name = "trashcan_test"
